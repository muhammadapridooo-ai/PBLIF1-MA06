
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tambah dan Edit Data</title>

    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/form.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="brand">
            <img src="assets/logo.jpg" alt="Logo">
            <h2>Aplikasi Pencatatan Servis Kendaraan Pribadi</h2>
        </div>

        <div class="header-right">
            <input type="text" placeholder="Cari kendaraan, servis, bengkel...">
            <div class="user-menu" id="userName">Nama Pengguna ▾</div>
        </div>
    </header>

    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <nav>
                <a href="dashboard.html">Dashboard</a>
                <a href="pengelolaan.html" class="active">Pengelolaan Data</a>
                <a href="laporan.html">Laporan</a>
                <a href="index.html" id="logoutButton">Logout</a>
            </nav>
        </aside>

        <!-- KONTEN UTAMA -->
        <main class="main-content">

            <p class="breadcrumb">
                Beranda &gt; Pengelolaan Data &gt; Form Tambah / Edit
            </p>

            <h1>Form Tambah dan Edit Data</h1>

            <section class="form-section">

                <h2>Form Tambah Riwayat Servis</h2>

                <form id="serviceForm">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="vehicle">Kendaraan *</label>
                            <select id="vehicle" required>
                                <option value="">-- Pilih kendaraan --</option>
                                <option value="BP 1234 AB">BP 1234 AB – Honda Vario 150</option>
                                <option value="BP 5678 CD">BP 5678 CD – Toyota Avanza</option>
                                <option value="BP 9012 EF">BP 9012 EF – Yamaha NMAX</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="date">Tanggal *</label>
                            <input type="date" id="date" required>
                        </div>

                        <div class="form-group">
                            <label for="kilometer">Kilometer *</label>
                            <input type="number" id="kilometer"
                                   min="0" placeholder="Contoh: 24500" required>
                        </div>

                        <div class="form-group">
                            <label for="serviceType">Jenis Servis *</label>
                            <select id="serviceType" required>
                                <option value="">-- Pilih jenis servis --</option>
                                <option value="Ganti Oli">Ganti Oli</option>
                                <option value="Servis Berkala">Servis Berkala</option>
                                <option value="Ganti Ban">Ganti Ban</option>
                                <option value="Tune Up">Tune Up</option>
                                <option value="Ganti Aki">Ganti Aki</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="workshop">Bengkel *</label>
                            <input type="text" id="workshop"
                                   placeholder="Nama bengkel" required>
                        </div>

                        <div class="form-group">
                            <label for="cost">Biaya (Rp) *</label>
                            <input type="number" id="cost" min="0"
                                   placeholder="Contoh: 85000" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="notes">Catatan (opsional)</label>
                            <textarea id="notes" rows="4"
                                placeholder="Masukkan catatan tambahan..."></textarea>
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="submit" class="save-button">
                            Simpan
                        </button>

                        <a href="pengelolaan.html" class="cancel-button">
                            Batal
                        </a>
                    </div>

                    <p id="formMessage" class="form-message"></p>

                </form>

            </section>

        </main>
    </div>

    <script src="js/form.js"></script>

</body>
</html>
